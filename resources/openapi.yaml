                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BrainArticle' }
    post:
      operationId: createBrainArticle
      tags: [Brain articles]
      summary: Create an article in a brain (admin only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/BrainUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
                is_public: { type: boolean, default: true }
      responses:
        '201':
          description: Article created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BrainArticle' }

  /brains/{brain}/articles/{article}:
    get:
      operationId: showBrainArticle
      tags: [Brain articles]
      summary: Show an article
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/BrainUlid'
        - name: article
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BrainArticle' }
    put:
      operationId: updateBrainArticle
      tags: [Brain articles]
      summary: Update an article (admin only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/BrainUlid'
        - name: article
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                is_public: { type: boolean }
      responses:
        '200':
          description: Updated article
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BrainArticle' }
    delete:
      operationId: deleteBrainArticle
      tags: [Brain articles]
      summary: Delete an article (admin only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/BrainUlid'
        - name: article
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Article deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum API token. Generate one from Settings > API Tokens.

  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: false
      schema:
        type: integer
      description: |
        Workspace ID this request targets. Required for tokens that have
        access to multiple workspaces or to all workspaces. Optional for
        tokens scoped to a single workspace (auto-resolved).
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    TicketUlid:
      name: ticket
      in: path
      required: true
      schema: { type: string }
      description: Ticket ULID.
    ContactUlid:
      name: contact
      in: path
      required: true
      schema: { type: string }
      description: Contact ULID.
    CompanyUlid:
      name: company
      in: path
      required: true
      schema: { type: string }
      description: Company ULID.
    TagUlid:
      name: tag
      in: path
      required: true
      schema: { type: string }
      description: Tag ULID.
    BrainUlid:
      name: brain
      in: path
      required: true
      schema: { type: string }
      description: Brain ULID.

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    PendingAttachment:
      type: object
      properties:
        token: { type: string, example: upl_screenshot_8f3c1a }
        filename: { type: string, example: screenshot.png }
        mime_type: { type: string, example: image/png }
        size: { type: integer, example: 84213 }
        expires_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
        timezone: { type: string, nullable: true }

    Workspace:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        slug: { type: string }

    Channel:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [email, widget]
        color: { type: string }
        email_address: { type: string, nullable: true }

    Tag:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        color: { type: string }

    Contact:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
        company:
          nullable: true
          description: The company this contact belongs to, or null.
          allOf:
            - $ref: '#/components/schemas/ContactCompany'
        ticket_count: { type: integer, nullable: true }
        last_activity_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }

    ContactCompany:
      type: object
      properties:
        ulid: { type: string }
        name: { type: string }
        domain: { type: string, nullable: true }

    Company:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        domain: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        contact_count: { type: integer, nullable: true }
        ticket_count: { type: integer, nullable: true }

    Team:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        member_count: { type: integer }

    QuickReply:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        body: { type: string }

    SavedView:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string, nullable: true }
        is_personal: { type: boolean }
        search: { type: string, nullable: true }
        statuses:
          type: array
          items: { type: string }
          nullable: true
        assigned_to_me: { type: boolean }
        unassigned: { type: boolean }
        assigned_user_id: { type: integer, nullable: true }
        channel_ids:
          type: array
          items: { type: integer }
        tag_ids:
          type: array
          items: { type: integer }

    WorkflowConditionInput:
      type: object
      required: [type, parameters]
      properties:
        type:
          type: string
          enum:
            - body_contains
            - channel_is
            - contact_is_new
            - from_domain_equals
            - from_email_contains
            - from_email_equals
            - subject_contains
            - subject_equals
        parameters: { type: object }

    WorkflowActionInput:
      type: object
      required: [type, parameters]
      properties:
        type: { type: string }
        parameters: { type: object }

    Workflow:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        trigger_type:
          type: string
          enum: [on_new_ticket, on_inbound_message, on_no_reply, manual]
        trigger_parameters:
          type: object
          nullable: true
          description: Present for on_no_reply workflows. The unit defaults to hours. Durations are capped at 30 days in total. With only_business_hours, minutes and hours pause outside workspace business hours, and days count business days; fully closed days do not count.
          properties:
            value: { type: integer, minimum: 1, description: 'Duration amount. Combined with unit, capped at 30 days in total.' }
            unit: { type: string, enum: [minutes, hours, days], default: hours }
            only_business_hours: { type: boolean, default: false }
        condition_match_type:
          type: string
          enum: [all, any]
        is_enabled: { type: boolean }
        order_column: { type: integer }
        created_at: { type: string, format: date-time }
        conditions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              ulid: { type: string }
              type: { type: string }
              parameters: { type: object }
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              ulid: { type: string }
              type: { type: string }
              parameters: { type: object }

    Brain:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        name: { type: string }
        additional_instructions: { type: string, nullable: true }
        article_count: { type: integer }
        created_at: { type: string, format: date-time }

    BrainArticle:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        brain_id: { type: integer }
        title: { type: string }
        body: { type: string }
        is_public: { type: boolean }
        last_edited_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        type:
          type: string
          enum: [inbound, outbound, note]
        body_html: { type: string }
        body_text: { type: string, nullable: true }
        sender:
          type: object
          properties:
            id: { type: integer }
            type: { type: string, enum: [contact, user] }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
            avatar_url: { type: string, nullable: true }
        attachments:
          type: array
          description: |
            Files sent alongside the message. Fetch `url` (or `download_url`)
            with the same Bearer token, see `GET /attachments/{media}`.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              url: { type: string, format: uri }
              download_url: { type: string, format: uri }
              size: { type: integer }
              mime_type: { type: string }
        inline_images:
          type: array
          description: |
            Images embedded inside `body_html` (typically bug screenshots
            customers paste into emails). Each item exposes a stable
            `url` matching the `<img src>` in the body, plus a
            `download_url` that forces a file download. Use these URLs
            with the same Bearer token to fetch the binary, see
            `GET /attachments/{media}`.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              mime_type: { type: string }
              size: { type: integer }
              content_id: { type: string, nullable: true }
              url: { type: string, format: uri }
              download_url: { type: string, format: uri }
        is_forward: { type: boolean }
        send_status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Activity:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        type: { type: string }
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        properties:
          type: object
          nullable: true
        description: { type: string }
        created_at: { type: string, format: date-time }

    Ticket:
      type: object
      properties:
        id: { type: integer }
        ulid: { type: string }
        number: { type: integer }
        subject: { type: string }
        status:
          type: string
          enum: [open, waiting, closed, spam]
        channel: { $ref: '#/components/schemas/Channel' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        assigned_team:
          oneOf:
            - $ref: '#/components/schemas/Team'
            - type: 'null'
        contact: { $ref: '#/components/schemas/Contact' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        custom_fields:
          type: array
          description: >
            Every custom field that applies to this ticket's channel, whether or
            not it holds a value. Returned on GET /tickets/{ticket} and on every
            ticket write response; omitted from the paginated list.
          items: { $ref: '#/components/schemas/TicketCustomField' }
        latest_message_preview: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        title: { type: string, nullable: true }
        from_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }

    CustomFieldDefinition:
      type: object
      properties:
        ulid: { type: string }
        name: { type: string, example: Billable }
        type:
          type: string
          enum: [text, single_select, multi_select]
        all_channels:
          type: boolean
          description: When true the field applies to every channel and channel_ulids is empty.
        channel_ulids:
          type: array
          items: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/TicketCustomFieldOption' }

    TicketCustomField:
      type: object
      properties:
        ulid: { type: string }
        name: { type: string, example: Reported version }
        type:
          type: string
          enum: [text, single_select, multi_select]
        value:
          type: string
          nullable: true
          description: Set for text fields only; null for the two select types.
        selected_option_ulids:
          type: array
          items: { type: string }
          description: Empty for text fields and for select fields with no value.
        options:
          type: array
          description: The options an admin defined, in the order they arranged them. Empty for text fields.
          items: { $ref: '#/components/schemas/TicketCustomFieldOption' }

    TicketCustomFieldOption:
      type: object
      properties:
        ulid: { type: string }
        name: { type: string, example: Laravel }
        color: { type: string, nullable: true, example: '#FCA5A5' }
        icon: { type: string, nullable: true, example: flame }

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/Message' }
            activities:
              type: array
              items: { $ref: '#/components/schemas/Activity' }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    PaginatedTickets:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        links: { $ref: '#/components/schemas/PaginationLinks' }

    PaginatedContacts:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        links: { $ref: '#/components/schemas/PaginationLinks' }

    PaginatedCompanies:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Company' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        links: { $ref: '#/components/schemas/PaginationLinks' }

    PaginatedActivities:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        links: { $ref: '#/components/schemas/PaginationLinks' }

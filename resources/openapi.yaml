openapi: 3.1.0
info:
  title: There There API
  description: |
    REST API for There There, the AI-powered helpdesk. All endpoints require
    authentication via a Sanctum bearer token, and most require the
    `X-Workspace-Id` header to identify which workspace the request targets.

    Responses follow a consistent shape: single resources are returned under a
    `data` key; collections return `data` alongside `meta` and `links` for
    pagination.
  version: 1.0.0

servers:
  - url: https://there-there.app/api
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Me
  - name: Tickets
  - name: Ticket messages
  - name: Ticket tags
  - name: Ticket custom fields
  - name: Custom fields
  - name: Ticket activities
  - name: Contacts
  - name: Companies
  - name: Tags
  - name: Channels
  - name: Teams
  - name: Members
  - name: Quick replies
  - name: Saved views
  - name: Workflows
  - name: Brains
  - name: Brain articles

paths:
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: Get authenticated user and workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: The current user and workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      workspace:
                        $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /tickets:
    get:
      operationId: listTickets
      tags: [Tickets]
      summary: List tickets
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: filter[status]
          in: query
          schema: { type: string }
          description: Comma-separated status values (open, waiting, closed, spam).
        - name: filter[tag_ulids]
          in: query
          schema: { type: string }
          description: Comma-separated tag ULIDs.
        - name: filter[channel_ulids]
          in: query
          schema: { type: string }
          description: Comma-separated channel ULIDs.
        - name: filter[custom_fields][{customFieldUlid}]
          in: query
          schema: { type: string }
          description: >
            Comma-separated option ULIDs for the given custom field. Repeat the
            parameter with a different field ULID to narrow further: options of
            one field widen the result, separate fields narrow it. An option
            ULID that does not exist matches nothing rather than being ignored.
            Resolve both ULIDs with GET /custom-fields.
        - name: include
          in: query
          schema: { type: string, example: custom_fields }
          description: >
            Comma-separated extras to embed. `custom_fields` adds each ticket's
            custom field values, resolved once for the page. Opt-in, so payloads
            do not grow for integrations that do not ask.
        - name: filter[assigned_to_me]
          in: query
          schema: { type: boolean }
        - name: filter[unassigned]
          in: query
          schema: { type: boolean }
        - name: filter[assigned_user_ulid]
          in: query
          schema: { type: string }
        - name: filter[search]
          in: query
          schema: { type: string }
          description: Full-text search across subject, messages, and contact info.
        - name: q
          in: query
          schema: { type: string }
          description: Semantic search (requires AI to be enabled).
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, updated_at, -updated_at, last_activity_at, -last_activity_at]
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createTicket
      tags: [Tickets]
      summary: Create a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, subject, from_contact, message]
              properties:
                channel:
                  type: string
                  description: Channel ULID.
                subject:
                  type: string
                  maxLength: 255
                from_contact:
                  type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email }
                    name: { type: string, nullable: true }
                message:
                  type: object
                  required: [body]
                  properties:
                    body:
                      type: string
                      description: HTML body of the first message.
                    attachment_ids:
                      type: array
                      maxItems: 10
                      items: { type: string, example: upl_screenshot_8f3c1a }
                      description: Upload tokens from POST /attachments. Embed a token as <img src="cid:TOKEN"> in the body to render it inline.
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '422':
          $ref: '#/components/responses/ValidationError'

  /custom-fields:
    get:
      operationId: listCustomFields
      tags: [Custom fields]
      summary: List custom field definitions
      description: >
        Every ticket custom field defined in the workspace, with its options.
        This is where an integration resolves a field or option name to the ulid
        the ticket endpoints expect. Read only: fields are defined in the app.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: Custom field definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomFieldDefinition' }

  /tickets/import:
    post:
      operationId: importTickets
      tags: [Tickets]
      summary: Import a historical ticket
      description: >-
        Backfills a past conversation with its original timestamps, status, and full
        message thread. Nothing is sent or triggered: no email, workflows, notifications,
        or automations run. Requires an admin token. Has its own rate limit of 300
        requests per minute, separate from the standard API limit.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, subject, status, from_contact, messages]
              properties:
                channel:
                  type: string
                  description: Channel ULID.
                subject:
                  type: string
                  maxLength: 255
                status:
                  type: string
                  enum: [open, waiting, closed, spam]
                created_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When the ticket was originally created. Must be in the past. Defaults to the earliest message.
                closed_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When the ticket was resolved. Must be in the past. Used only when status is closed.
                external_id:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: Your own identifier for the ticket. Re-importing the same external_id returns the existing ticket.
                assignee_email:
                  type: string
                  format: email
                  nullable: true
                  description: Email of a workspace member to assign. Ignored unless it is an active member with access to the channel.
                tags:
                  type: array
                  maxItems: 50
                  items: { type: string }
                  description: Tag names to attach. A tag is created if it does not exist yet.
                from_contact:
                  type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email }
                    name: { type: string, nullable: true }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: The conversation, in chronological order.
                  items:
                    type: object
                    required: [type, body]
                    properties:
                      type:
                        type: string
                        enum: [inbound, outbound, note]
                      body:
                        type: string
                        description: HTML body of the message.
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the message was sent. Must be in the past. Defaults to the ticket created_at.
                      author_email:
                        type: string
                        format: email
                        nullable: true
                        description: Email of the agent who wrote an outbound message or note.
                      author_name:
                        type: string
                        nullable: true
                        description: Display name of that agent, used when author_email is not a workspace member.
                      external_id:
                        type: string
                        nullable: true
                        maxLength: 255
                        description: Your own identifier for the message, stored for correlation.
                      attachment_ids:
                        type: array
                        maxItems: 10
                        items: { type: string, example: upl_screenshot_8f3c1a }
                        description: Upload tokens from POST /attachments. Embed a token as <img src="cid:TOKEN"> in the body to render it inline.
      responses:
        '201':
          description: Ticket imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attachments:
    post:
      operationId: uploadAttachment
      tags: [Ticket messages]
      summary: Upload a file and receive a single-use token
      description: >-
        Streams a file to storage and returns an opaque token. Reference the token in
        a message's attachment_ids (and, for inline images, embed it in the body as
        <img src="cid:TOKEN">). Tokens are single-use, scoped to the creating API token,
        and deleted ~30 minutes after upload if not used. Max 25 MB per file.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: File parked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PendingAttachment' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Upload rate limit or per-workspace parked cap exceeded

  /attachments/{media}:
    get:
      operationId: downloadAttachment
      tags: [Ticket messages]
      summary: Download an attachment or inline image
      description: >-
        Returns the file itself, served inline under its own content type. The url and
        download_url on a message's attachments and inline_images point here whenever the
        ticket was fetched with an API token, so use those values rather than building
        this URL yourself. Files kept on object storage answer with a redirect to a
        short-lived storage URL, so follow redirects. No X-Workspace-Id header is needed:
        the workspace is derived from the file.
      parameters:
        - name: media
          in: path
          required: true
          description: ULID of the file, taken from a message's attachments or inline_images.
          schema: { type: string }
        - name: download
          in: query
          required: false
          description: Set to 1 to receive a Content-Disposition attachment header instead of an inline one.
          schema: { type: boolean }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a short-lived object storage URL
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticket}:
    get:
      operationId: showTicket
      tags: [Tickets]
      summary: Show a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      responses:
        '200':
          description: Ticket with messages and activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TicketDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticket}/status:
    put:
      operationId: updateTicketStatus
      tags: [Tickets]
      summary: Change ticket status
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, waiting, closed, spam]
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'

  /tickets/{ticket}/assignee:
    put:
      operationId: updateTicketAssignee
      tags: [Tickets]
      summary: Assign a user to a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee_ulid:
                  type: string
                  nullable: true
                  description: User ULID, or null to unassign.
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'

  /tickets/{ticket}/team:
    put:
      operationId: updateTicketTeam
      tags: [Tickets]
      summary: Assign a team to a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_ulid:
                  type: string
                  nullable: true
                  description: Team ULID, or null to unassign.
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'

  /tickets/{ticket}/channel:
    put:
      operationId: updateTicketChannel
      tags: [Tickets]
      summary: Move a ticket to another channel
      description: >
        Moves the ticket to another email channel in the same workspace. Anyone
        without access to the target channel is unassigned and removed as a
        watcher. Support bubble conversations cannot be moved, and support
        bubble channels cannot be moved into.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_ulid]
              properties:
                channel_ulid:
                  type: string
                  description: ULID of the channel to move the ticket to.
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '422':
          description: The channel is not accessible, or the ticket cannot be moved.

  /tickets/{ticket}/reply:
    post:
      operationId: replyToTicket
      tags: [Ticket messages]
      summary: Reply to a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                to_recipients:
                  type: array
                  items: { type: string, format: email }
                cc_recipients:
                  type: array
                  items: { type: string, format: email }
                bcc_recipients:
                  type: array
                  items: { type: string, format: email }
                attachment_ids:
                  type: array
                  maxItems: 10
                  items: { type: string, example: upl_screenshot_8f3c1a }
                  description: Upload tokens from POST /attachments. Embed a token as <img src="cid:TOKEN"> in the body to render it inline.
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'

  /tickets/{ticket}/forward:
    post:
      operationId: forwardTicket
      tags: [Ticket messages]
      summary: Forward a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, to_recipients]
              properties:
                body: { type: string }
                to_recipients:
                  type: array
                  minItems: 1
                  items: { type: string, format: email }
                cc_recipients:
                  type: array
                  items: { type: string, format: email }
                bcc_recipients:
                  type: array
                  items: { type: string, format: email }
                forwarded_from_message_ulid:
                  type: string
                  nullable: true
                  description: ULID of the message being forwarded.
                attachment_ids:
                  type: array
                  maxItems: 10
                  items: { type: string, example: upl_screenshot_8f3c1a }
                  description: Upload tokens from POST /attachments. Embed a token as <img src="cid:TOKEN"> in the body to render it inline.
      responses:
        '201':
          description: Forward message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'

  /tickets/{ticket}/note:
    post:
      operationId: addNoteToTicket
      tags: [Ticket messages]
      summary: Add an internal note
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                attachment_ids:
                  type: array
                  maxItems: 10
                  items: { type: string, example: upl_screenshot_8f3c1a }
                  description: Upload tokens from POST /attachments. Embed a token as <img src="cid:TOKEN"> in the body to render it inline.
      responses:
        '201':
          description: Note message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'

  /tickets/{ticket}/tags/{tag}:
    post:
      operationId: addTagToTicket
      tags: [Ticket tags]
      summary: Add a tag to a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
        - name: tag
          in: path
          required: true
          schema: { type: string }
          description: Tag ULID.
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
    delete:
      operationId: removeTagFromTicket
      tags: [Ticket tags]
      summary: Remove a tag from a ticket
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
        - name: tag
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Tag removed

  /tickets/{ticket}/custom-fields/{customField}:
    put:
      operationId: setTicketCustomField
      tags: [Ticket custom fields]
      summary: Set a custom field on a ticket
      description: >
        Replaces the ticket's value for one custom field. Send `value` for a text
        field and `option_ulids` for the two select types; sending both, or the
        wrong one for the field's type, is a validation error. An empty `value`
        and an empty `option_ulids` clears the field. Returns 404 when the field
        belongs to another workspace or is not available on the ticket's channel.
        Read the current values from GET /tickets/{ticket}, which returns the
        fields that apply to the ticket whether or not they hold a value.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
        - name: customField
          in: path
          required: true
          schema: { type: string }
          description: Custom field ULID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, option_ulids]
              properties:
                value:
                  type: string
                  nullable: true
                  description: The text for a text field, or null. Must be null for select fields.
                  example: 1.2.3
                option_ulids:
                  type: array
                  items: { type: string }
                  description: >
                    The option ULIDs that should end up selected, which replaces the
                    current selection rather than adding to it. At most one for a
                    single-select field. Must be empty for text fields.
      responses:
        '200':
          description: Updated ticket, including its custom fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tickets/{ticket}/activities:
    get:
      operationId: listTicketActivities
      tags: [Ticket activities]
      summary: List ticket activities
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/TicketUlid'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivities'

  /contacts:
    get:
      operationId: listContacts
      tags: [Contacts]
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[email]
          in: query
          schema: { type: string }
        - name: filter[search]
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, last_activity, -last_activity]
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContacts'
    post:
      operationId: createContact
      tags: [Contacts]
      summary: Create a contact
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }

  /contacts/{contact}:
    get:
      operationId: showContact
      tags: [Contacts]
      summary: Show a contact
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/ContactUlid'
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    put:
      operationId: updateContact
      tags: [Contacts]
      summary: Update a contact
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/ContactUlid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                name: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                company_ulid:
                  type: string
                  nullable: true
                  description: >-
                    ULID of the company to attach the contact to. Send null to detach it.
                    A ULID from another workspace returns 404.
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Contact' }
    delete:
      operationId: deleteContact
      tags: [Contacts]
      summary: Delete a contact (admin only)
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/ContactUlid'
      responses:
        '204':
          description: Contact deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies:
    get:
      operationId: listCompanies
      tags: [Companies]
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[domain]
          in: query
          schema: { type: string }
        - name: filter[search]
          in: query
          description: Matches the company name or its domain.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, contact_count, -contact_count, ticket_count, -ticket_count]
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanies'
    post:
      operationId: createCompany
      tags: [Companies]
      summary: Create a company
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                domain:
                  type: string
                  nullable: true
                  description: >-
                    Bare hostname, lowercased. Unique per workspace. An email address,
                    a scheme, or a path is rejected.
                phone: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                contact_ulids:
                  type: array
                  description: >-
                    Contacts to attach to the new company. A ULID from another workspace
                    is ignored.
                  items: { type: string }
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Company' }


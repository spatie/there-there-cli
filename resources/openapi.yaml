                    only_business_hours: { type: boolean, default: false }
                condition_match_type:
                  type: string
                  enum: [all, any]
                  default: all
                is_enabled:
                  type: boolean
                  default: true
                conditions:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowConditionInput'
                actions:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowActionInput'
      responses:
